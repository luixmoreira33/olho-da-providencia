apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "olho-da-providencia.fullname" . }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: olho.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "olho-da-providencia.fullname" . }}
                port:
                  number: 8000
