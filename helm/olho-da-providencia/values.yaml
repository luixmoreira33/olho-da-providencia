replicaCount: 1

image:
  repository: olho-da-providencia
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

env:
  USE_MOCK_IF_UNCONFIGURED: "true"
  JWT_SECRET: "change-me"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
